server {
    listen 80;
    server_name demo1-ecommerce.radiantcode.web.id 161.118.235.23 localhost;

    client_max_body_size 50M;

    root /var/www/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location ^~ /storage/ {
        alias /var/www/backend/storage/app/public/;
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires max;
    }

    location ~ ^/(api|admin|cms|livewire|sanctum|_filament|up|auth) {
        root /var/www/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }
    }

    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ ^/(css|js|fonts|vendor|build)/ {
        root /var/www/backend/public;
        try_files $uri =404;
        access_log off;
        expires max;
    }

    # Frontend Assets (Hashed Vite files)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend Single Page Application (SPA) Fallback - NEVER cache index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
