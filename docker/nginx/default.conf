# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    server_name demo1-ecommerce.radiantcode.web.id 161.118.235.23;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Main Application Server
server {
    listen 443 ssl;
    http2 on;
    server_name demo1-ecommerce.radiantcode.web.id 161.118.235.23;

    ssl_certificate /etc/letsencrypt/live/demo1-ecommerce.radiantcode.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo1-ecommerce.radiantcode.web.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Root default untuk Frontend React SPA
    root /var/www/frontend/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Routing Media / Storage Laravel
    location ^~ /storage/ {
        alias /var/www/backend/storage/app/public/;
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires max;
    }

    # Routing Filament CMS, Laravel API, Livewire, Auth
    location ~ ^/(api|admin|livewire|sanctum|_filament|up|auth) {
        root /var/www/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }
    }

    # Direct PHP file processing
    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Aset Statis Filament CMS & Backend (CSS, JS, Fonts, Icons)
    location ~ ^/(css|js|fonts|vendor|build)/ {
        root /var/www/backend/public;
        try_files $uri =404;
        access_log off;
        expires max;
    }

    # Frontend Single Page Application (SPA) Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: Hide dotfiles (kecuali .well-known untuk Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
