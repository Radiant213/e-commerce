server {
    listen 80;
    server_name demo1-ecommerce.radiantcode.web.id 161.118.235.23 localhost;

    client_max_body_size 50M;

    # Root default untuk Frontend React SPA
    root /var/www/frontend/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Routing Media / Storage Laravel
    location ^~ /storage/ {
        alias /var/www/backend/storage/app/public/;
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires max;
    }

    # Routing Filament CMS, Laravel API, Livewire, Auth
    location ~ ^/(api|admin|livewire|sanctum|_filament|up) {
        root /var/www/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }
    }

    # Direct PHP file processing
    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Frontend Single Page Application (SPA) Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: Hide dotfiles (kecuali .well-known untuk Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
